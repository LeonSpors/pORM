name: Run tests

on:
  push:
    branches:
      - develop
      - main
      - 'changes/**'
      - 'bugfixes/**'
      - 'features/**'
      - 'qol/**'
  pull_request:
    branches:
      - develop
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore
        run: dotnet restore pORM.sln

      - name: Build
        run: dotnet build pORM.sln --configuration Release --no-restore

      - name: Run tests
        run: dotnet test pORM.sln --configuration Release --no-build --logger "trx;LogFileName=test-results.trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults
